openapi: 3.1.0

info:
  title: Todo
  version: 0.0.1
  description: Mňau

servers:
  - url: /api

tags:
  - name: Tasks
    description: Task management

paths:
  /tasks:
    get:
      tags:
        - Tasks
      summary: List all tasks
      operationId: getTasks
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

    post:
      tags:
        - Tasks
      summary: Create a new task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/TaskId"

    get:
      tags:
        - Tasks
      summary: Get task detail
      operationId: getTask
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

    put:
      tags:
        - Tasks
      summary: Update a task
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "200":
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

    delete:
      tags:
        - Tasks
      summary: Delete a task
      operationId: deleteTask
      responses:
        "204":
          description: Task deleted successfully

components:
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      description: Task ID
      schema:
        type: integer
      example: 12

  schemas:
    Task:
      type: object
      required:
        - id
        - title
        - doUntil
        - createdAt
        - text
      properties:
        id:
          type: integer
          readOnly: true
          example: 12

        title:
          type: string
          example: Make todo app

        doUntil:
          type:
            - string
          example: "2026-11-24"

        createdAt:
          type: string
          example: "2026-01-15"

        text:
          type: string
          example: "make todo app by tommorow"

    TaskInput:
      type: object
      required:
        - title
        - doUntil
        - text
      properties:
        title:
          type: string
          example: "Todo app"

        doUntil:
          type: string
          example: "2026-10-28"

        text:
          type: string
          example: "make todo app by tommorow"